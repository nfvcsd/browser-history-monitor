services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - history-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EXTENSION_AUTH_MODE: ${EXTENSION_AUTH_MODE:-development}
      EXTENSION_GOOGLE_CLIENT_IDS: ${EXTENSION_GOOGLE_CLIENT_IDS:-}
      EXTENSION_WORKSPACE_DOMAINS: ${EXTENSION_WORKSPACE_DOMAINS:-}
      DEV_EXTENSION_TOKEN: ${DEV_EXTENSION_TOKEN}
      # This compose stack is for local development. Select google explicitly for rollout.
      AUTH_MODE: ${AUTH_MODE:-development}
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_WORKSPACE_DOMAINS: ${GOOGLE_WORKSPACE_DOMAINS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  history-postgres:
